# Disposable test: does the Garnet record of a run stay readable after the
# GitHub Actions run is deleted? Harmless workload, branch-only trigger.
name: Disposable Garnet run (deletion test)

on:
  push:
    branches: [devin/*-disposable-run-deletion]

permissions:
  contents: read
  id-token: write

jobs:
  disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record this job with Garnet
        uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
      - name: Harmless workload
        run: |
          curl -fsS -o /dev/null -w "example.com %{http_code}\n" https://example.com/
          echo "disposable run ${GITHUB_RUN_ID}"
