# Deletes the disposable Garnet run 45256297491 with this repo's own GITHUB_TOKEN,
# then confirms GitHub answers 404 for it.
name: Delete disposable Garnet run

on:
  push:
    branches: [devin/*-disposable-run-deletion]

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete run 45256297491
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: "45256297491"
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}"
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}")
          echo "GET run ${TARGET_RUN} after delete: HTTP ${code}"
          test "${code}" = "404"
